name: AI API Key Scanner - Auto Scan

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）自动运行
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scan:
    name: 自动扫描
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行扫描
        id: scan
        env:
          GH_SCAN_TOKEN: ${{ secrets.GH_SCAN_TOKEN }}
        run: python scan_github.py --auto --max-repos 20

      - name: 提交报告
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scan_reports scan_history || true
          git commit -m "chore: 自动扫描报告 $(date -u +%Y-%m-%d)" || echo "没有需要提交的变更"
          git push || echo "无需推送"

      - name: 上传 Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-reports
          path: scan_reports/
          retention-days: 90

      - name: 发现密钥时创建 Issue
        if: always() && steps.scan.outputs.new_findings != '0' && steps.scan.outputs.new_findings != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create security --color B60205 --description "安全相关问题" 2>/dev/null || true
          gh issue create \
            --title "🔐 发现 ${{ steps.scan.outputs.new_findings }} 条疑似泄露的 AI API 密钥" \
            --body-file "${{ steps.scan.outputs.issue_path }}" \
            --label security || true
